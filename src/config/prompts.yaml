# LLM提示词配置文件
# 招聘信息提取提示词
extract_recruitment_info: |
  你是一位专业的招聘信息分析员，请从以下招聘信息中提取结构化数据。
  请严格按照JSON格式输出，不要添加任何解释或额外内容。
  提取的字段包括：
  - job_title: 职位名称
  - company: 公司名称
  - company_address: 公司地址
  - company_founded: 公司成立时间
  - company_type: 公司性质（私企、国企等）
  - company_size: 公司人数
  - industry: 行业领域
  - location: 工作地点
  - salary: 薪资范围
  - experience: 工作经验要求
  - education: 学历要求
  - job_type: 工作类型（全职、兼职、实习等）
  - department: 部门
  - description: 职位描述
  - requirements: 职位要求
  - benefits: 福利待遇
  - benefits_detailed: 具体福利详情
  - post_date: 发布日期
  - contact_email: 联系邮箱
  - contact_phone: 联系电话
  - application_deadline: 申请截止日期
  - work_mode: 工作模式（远程/现场/混合）
  - probation_period: 试用期
  - working_hours: 工作时间/班次
  - training_development: 培训与职业发展
  - interview_process: 面试流程
  - company_website: 公司官网
  - recruiter_name: 招聘联系人
  如果某些字段不存在，请使用null值。
  
  招聘信息内容：
  {content}

# 招聘信息分析提示词
analyze_recruitment_info: |
  你是一位专业的招聘市场分析师，请根据以下招聘信息数据和指定的分析维度，生成一份全面的招聘市场分析报告。
  
  # 分析要求
  1. 请按照指定的分析维度进行分析，只分析启用的维度
  2. 分析结果应基于提供的招聘数据，避免主观臆断
  3. 使用清晰的数据统计和描述性语言
  4. 分析过程要全面，覆盖数据中的主要特征和趋势
  5. 对于缺失数据或异常值，要适当说明
  6. 报告结构清晰，层次分明，使用Markdown格式
  7. **不需要依次分析各个维度**，而是创建一个综合对比表格
  8. **表格格式要求**：
     - 横向（列）是各个分析维度
     - 纵向（行）是各个招聘岗位
     - 每个单元格填写对应岗位在该维度的具体信息
  9. 基于综合对比表格进行总结和分析，形成完整的市场洞察
  
  # 分析维度配置
  # 薪资分析
  - name: "salary_analysis"
    enabled: true
    description: "分析薪资分布、薪资区间统计"
  # 工作经验要求分析
  - name: "experience_analysis"
    enabled: true
    description: "分析工作经验要求分布"
  # 学历要求分析
  - name: "education_analysis"
    enabled: true
    description: "分析学历要求分布"
  # 行业分布分析
  - name: "industry_analysis"
    enabled: true
    description: "分析招聘信息所属行业分布"
  # 职位类型分析
  - name: "job_type_analysis"
    enabled: true
    description: "分析全职/兼职等职位类型分布"
  # 公司规模分析
  - name: "company_size_analysis"
    enabled: true
    description: "分析招聘公司的规模分布"
  # 福利待遇分析
  - name: "benefits_analysis"
    enabled: true
    description: "分析常见福利待遇统计"
  # 关键词分析
  - name: "keywords_analysis"
    enabled: true
    description: "分析职位描述中的高频关键词"
  # 地理位置分析
  - name: "location_analysis"
    enabled: true
    description: "分析招聘信息的地理位置分布"
  # 所需技能分析
  - name: "skills_analysis"
    enabled: true
    description: "分析职位所需的核心技能和能力要求"
  
  # 招聘信息数据
  {recruitment_data}
  
  # 输出要求
  请输出一份完整的Markdown格式分析报告，包含以下部分：
  1. 报告摘要：简要介绍报告内容和主要发现（控制在150字以内）
  2. 数据概况：说明分析的数据量和数据来源（控制在150字以内）
  3. 岗位综合对比：创建一个综合对比表格，横向是分析维度（薪资、工作经验、学历、行业、职位类型、公司规模、福利待遇、关键词、地理位置、所需技能），纵向是各个招聘岗位，每个单元格填写对应岗位在该维度的具体信息
  4. 综合分析与总结：基于综合对比表格进行全面分析和总结，形成完整的市场洞察（控制在300字以内）
  5. 建议：针对求职者或招聘方提供有价值的建议（控制在150字以内）
  6. 附录：如果有需要补充的信息，可以放在附录中
  
  请确保报告内容专业、客观、易于理解，适合招聘市场分析使用。
  请确保生成完整的报告，特别是综合分析部分，不要截断。